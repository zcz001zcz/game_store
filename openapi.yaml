openapi: 3.1.0
info:
  title: Game Store Core API
  version: 2.0.0
  description: Multi-item digital-goods orders with exactly-once fulfillment/refunds, provider reconciliation, throttling and temporal history.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service is ready.
  /api/v1/catalog:
    get:
      operationId: listProducts
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {in: query, name: after_id, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Active products in stable keyset order.}
  /api/v1/orders:
    post:
      operationId: createOrder
      description: Accepts either the compatible legacy sku field or a multi-item basket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/LegacyOrderRequest'
                - $ref: '#/components/schemas/MultiItemOrderRequest'
      responses:
        '201': {description: Order created.}
        '200': {description: Idempotent replay of the same order_id and basket.}
        '409': {description: order_id was used for a different basket.}
  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Current order, per-item outcomes, codes/refunds and exact money equation.
        '404': {description: Order not found.}
  /api/v1/orders/{id}/state-at:
    get:
      operationId: getOrderStateAt
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - in: query
          name: at
          required: true
          schema: {type: string, format: date-time}
      responses:
        '200': {description: Last immutable order snapshot at or before the timestamp.}
        '404': {description: No state existed at that timestamp.}
  /api/v1/webhooks/payment:
    post:
      operationId: paymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentWebhook'}
      responses:
        '200': {description: Accepted, including duplicates and early events.}
  /stubs/providers/{provider}/issue:
    post:
      operationId: issueProviderCode
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderIssueRequest'}
      responses:
        '200': {description: Claim returned by the provider; it is not trusted until audited.}
        '409': {description: Out of stock or idempotency conflict.}
        '500': {description: Error may occur after an actual issue.}
        '503': {description: Failure before issue.}
  /stubs/providers/{provider}/issues/{request_id}:
    get:
      operationId: auditProviderIssue
      description: Independent settlement/reconciliation feed used to verify provider claims.
      parameters:
        - $ref: '#/components/parameters/Provider'
        - in: path
          name: request_id
          required: true
          schema: {type: string}
      responses:
        '200': {description: Authoritative issue record with requested and actual SKU.}
        '404': {description: No issue exists for request_id.}
  /api/v1/dev/providers/{provider}:
    get:
      operationId: getProviderStubSettings
      parameters:
        - $ref: '#/components/parameters/Provider'
      responses:
        '200': {description: Current stub mode and limit.}
    put:
      operationId: configureProviderStub
      parameters:
        - $ref: '#/components/parameters/Provider'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderSettings'}
      responses:
        '200': {description: Stub settings updated and limiter window reset.}
  /api/v1/ops/reconciliation:
    get:
      operationId: reconciliationReport
      parameters:
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: Payment, money, delivery and provider discrepancy report.}
  /api/v1/ops/recovery:
    post:
      operationId: recoverOrders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id: {type: string, pattern: '^ord_[A-Za-z0-9_-]{3,70}$'}
                limit: {type: integer, minimum: 1, maximum: 100}
                older_than_seconds: {type: integer, minimum: 1}
      responses:
        '200': {description: Recoverable orders safely returned to the queue.}
  /api/v1/ops/queue-progress:
    get:
      operationId: queueProgress
      responses:
        '200': {description: Queued/processing jobs and waiting/delivered/refunded items.}
  /api/v1/ops/history-summary:
    get:
      operationId: historySummary
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: order_id, schema: {type: string}}
      responses:
        '200': {description: Capture, delivery and refund deltas calculated only from immutable history.}
components:
  parameters:
    Provider:
      in: path
      name: provider
      required: true
      schema: {type: string, enum: [A, B]}
    OrderId:
      in: path
      name: id
      required: true
      schema: {type: string, pattern: '^ord_[A-Za-z0-9_-]{3,70}$'}
  schemas:
    LegacyOrderRequest:
      type: object
      required: [sku]
      properties:
        order_id: {type: string}
        sku: {type: string, example: STEAM-TOPUP-500}
      additionalProperties: false
    MultiItemOrderRequest:
      type: object
      required: [items]
      properties:
        order_id: {type: string}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/OrderItemRequest'}
      additionalProperties: false
    OrderItemRequest:
      type: object
      required: [sku, provider]
      properties:
        sku: {type: string}
        provider: {type: string, enum: [A, B]}
        allow_fallback: {type: boolean, default: false}
      additionalProperties: false
    PaymentWebhook:
      type: object
      required: [event_id, order_id, status, amount, currency, created_at]
      properties:
        event_id: {type: string}
        order_id: {type: string}
        status: {type: string, enum: [paid, failed]}
        amount: {oneOf: [{type: number}, {type: string}]}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        created_at: {type: string, format: date-time}
    ProviderIssueRequest:
      type: object
      required: [request_id, sku, order_id]
      properties:
        request_id: {type: string}
        sku: {type: string}
        order_id: {type: string}
      additionalProperties: false
    ProviderSettings:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [random, success, fail_before_issue, timeout_after_issue, out_of_stock, error_after_issue_once, duplicate_code_once, foreign_code_once, crash_after_issue_once]
        failure_rate: {type: number, minimum: 0, maximum: 1}
        timeout_rate: {type: number, minimum: 0, maximum: 1}
        timeout_ms: {type: integer, minimum: 1, maximum: 60000}
        rate_limit: {type: integer, minimum: 1, maximum: 10000}
        rate_window_seconds: {type: integer, minimum: 1, maximum: 3600}
